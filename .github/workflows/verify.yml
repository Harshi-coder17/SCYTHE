name: Verify SCYTHE
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_compose_smoke:
        description: Build disposable stack, run browser workflow and image vulnerability gate
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: scythe-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ENVIRONMENT: development
      SECRET_KEY: test-only-00000000000000000000000000000000
      SCYTHE_DB_PASSWORD: test-only-00000000000000000000000000000000
      REDIS_PASSWORD: test-only-00000000000000000000000000000000
      REDIS_SECURITY_PASSWORD: test-only-00000000000000000000000000000000
      SANDBOX_RUNNER_SECRET: test-only-00000000000000000000000000000000
      SHARED_DIR: ${{ github.workspace }}/.ci-test-artifacts
      PYTHONPATH: ${{ github.workspace }}/containers/backend
      DISABLE_HIBP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: containers/backend/requirements.txt
      - name: Install Linux runtime and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpq5 libzbar0 libgl1 tesseract-ocr
          python -m pip install --require-hashes -r containers/backend/requirements.txt
          python -m pip install pytest==8.4.2 pytest-asyncio==1.2.0 pytest-mock==3.15.1
      - name: Backend, URL contract and offline email regressions
        working-directory: containers/backend
        run: python -m pytest --import-mode=importlib tests services/email/tests -q --junitxml=${{ runner.temp }}/backend-tests.xml
      - name: Deployment, security-tool and research-gate regressions
        run: python -m pytest scripts/tests -q --junitxml=${{ runner.temp }}/script-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/*-tests.xml
          if-no-files-found: error
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install isolated sandbox test dependencies
        run: python -m pip install pytest==8.4.2 pytest-asyncio==1.2.0
      - name: SSRF, egress-proxy and redacted HAR tests
        run: python -m pytest -c containers/sandbox/pytest.ini containers/sandbox/tests -m "not integration" -q
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python -m pip install ruff==0.15.22
      - name: Validate GitHub Actions syntax and expressions
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/verify.yml
      - name: Lint changed Python project files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            python scripts/lint_changed.py --base "$BASE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            python scripts/lint_changed.py --base HEAD^
          else
            python -m ruff check containers/backend containers/sandbox/backend scripts
          fi
      - name: Extension syntax and auth/UNKNOWN regressions
        run: |
          find chrome-extension -name '*.js' -print0 | xargs -0 -n 1 node --check
          node scripts/test_extension_auth.cjs
  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned source scanners
        run: |
          python -m pip install bandit==1.9.4 pip-audit==2.10.1
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Required secret, SAST and locked-dependency scans
        run: python scripts/security_scan.py --checks secrets sast deps --output security-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-security-results
          path: security-results/*.json
          if-no-files-found: error
  compose-browser-workflow:
    if: github.event_name == 'workflow_dispatch' && inputs.run_compose_smoke
    needs: [backend, sandbox, quality, source-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      COMPOSE_PROJECT_NAME: scythe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Create disposable development secrets, never printed or uploaded
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          keys = ['SECRET_KEY','SCYTHE_DB_PASSWORD','POSTGRES_ROOT_PASSWORD','REDIS_PASSWORD','REDIS_SECURITY_PASSWORD','SANDBOX_RUNNER_SECRET','BACKUP_ENCRYPTION_KEY']
          lines = [key + '=' + secrets.token_hex(32) for key in keys]
          lines += ['ENVIRONMENT=development','REQUIRE_REAL_CERT=false','SHADOW_SCORING_ENABLED=false','NGINX_HTTP_PORT=8080','NGINX_HTTPS_PORT=8443','CORS_ALLOWED_ORIGINS=https://localhost:8443','ALLOWED_HOSTS=localhost,127.0.0.1,backend,nginx']
          Path('.env').write_text('\n'.join(lines) + '\n')
          Path('.env').chmod(0o600)
          PY
      - name: Build sandbox and pin its actual local image ID
        id: sandbox-build
        run: |
          docker build -f containers/sandbox/docker/Dockerfile -t scythe-sandbox:ci containers
          pin=$(docker image inspect scythe-sandbox:ci --format '{{.Id}}')
          printf 'SANDBOX_IMAGE=%s\n' "$pin" >> .env
          printf 'SANDBOX_IMAGE=%s\n' "$pin" >> "$GITHUB_ENV"
      - name: Build application stack
        id: app-build
        run: docker compose build backend celery_worker celery_beat celery_shadow_worker scythe_sandbox_runner nginx redis redis_security docker_socket_proxy
      - name: Start disposable development stack
        run: docker compose up -d --wait --wait-timeout 600
      - name: Install real browser workflow driver
        run: |
          python -m pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Authenticated browser URL/file workflow, ownership and revocation
        run: python scripts/frontend_workflow_smoke.py --origin https://localhost:8443 --url https://example.org/ --output frontend-workflow-smoke.json
      - name: Unpacked extension auth bridge in a real browser
        run: xvfb-run -a python scripts/test_extension_browser.py --origin https://localhost:8443 --extension chrome-extension
      - name: Encrypted backup and snapshot-consistent disposable restore
        run: python scripts/verify_backup_restore.py --output backup-restore-verification.json
      - name: Required image vulnerability gate
        if: always() && steps.app-build.outcome == 'success'
        run: python scripts/security_scan.py --checks images --trivy-image aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 --images scythe-backend:latest scythe-celery_worker:latest scythe-celery_beat:latest scythe-celery_shadow_worker:latest scythe-scythe_sandbox_runner:latest scythe-nginx:latest scythe-sandbox:ci scythe-redis:7.2-alpine-hardened scythe-socket-proxy:v0.5.0-hardened clamav/clamav:stable@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6 postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 --output security-results-images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compose-browser-and-image-results
          path: |
            frontend-workflow-smoke.json
            backup-restore-verification.json
            security-results-images/*.json
          if-no-files-found: warn
      - name: Remove disposable stack and secrets
        if: always()
        run: |
          docker compose down -v --remove-orphans
          rm -f .env

<!DOCTYPE html>
<html lang="en" class="bg-background">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCYTHE — Login / Sign up</title>
  <meta name="description" content="Access your SCYTHE security dashboard." />
  <meta name="theme-color" content="#0a0b0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="auth">
  <div class="auth-wrap">
    <div class="auth-glow"></div>
    <div class="auth-card">
      <div class="flex items-center gap-3 mb-6">
        <span class="brand"><img src="default_logo.jpeg" alt="SCYTHE" class="auth-logo-img"><span class="brand-name">SCYTHE</span></span>
      </div>

      <div class="auth-switch">
        <button id="tab-login" class="active" onclick="setMode('login')">Login</button>
        <button id="tab-signup" onclick="setMode('signup')">Sign up</button>
      </div>

      <h1 id="auth-title">Welcome back</h1>
      <p class="muted mb-6" id="auth-sub">Log in to access your threat dashboard.</p>

      <form id="auth-form" onsubmit="return submitAuth(event)">
        <div class="field" id="name-field" style="display:none">
          <label>Full name</label>
          <input class="input" type="text" placeholder="Ada Lovelace" />
        </div>
        <div class="field">
          <label>Email</label>
          <input class="input" type="email" placeholder="you@company.com" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input class="input" type="password" placeholder="••••••••" required />
        </div>
        <button class="btn btn-primary btn-block mt-4" type="submit" id="auth-submit">Login</button>
      </form>

      <p class="mt-4 text-center"><a href="index.html" class="muted">← Back to home</a></p>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script>
    const API_BASE = "http://localhost:8000";

    let mode = "login";

    function setMode(m) {
      mode = m;
      document.getElementById("tab-login").classList.toggle("active", m === "login");
      document.getElementById("tab-signup").classList.toggle("active", m === "signup");
      document.getElementById("name-field").style.display = m === "signup" ? "block" : "none";
      document.getElementById("auth-title").textContent = m === "signup" ? "Create account" : "Welcome back";
      document.getElementById("auth-sub").textContent =
        m === "signup" ? "Start scanning suspicious links in seconds." : "Log in to access your threat dashboard.";
      document.getElementById("auth-submit").textContent = m === "signup" ? "Create account" : "Login";
      clearError();
    }

    function showError(msg) {
      let el = document.getElementById("auth-error");
      if (!el) {
        el = document.createElement("p");
        el.id = "auth-error";
        el.style.cssText = "color:var(--danger);font-size:0.875rem;margin-top:12px;text-align:center;";
        document.getElementById("auth-form").appendChild(el);
      }
      el.textContent = msg;
    }

    function clearError() {
      const el = document.getElementById("auth-error");
      if (el) el.textContent = "";
    }

    async function submitAuth(e) {
      e.preventDefault();
      clearError();

      const emailInput    = document.querySelector("#auth-form input[type='email']");
      const passwordInput = document.querySelector("#auth-form input[type='password']");
      const submitBtn     = document.getElementById("auth-submit");

      const email    = emailInput.value.trim();
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = mode === "login" ? "Logging in…" : "Creating account…";

      try {
        if (mode === "signup") {
          // Step 1: Register
          const regRes = await fetch(`${API_BASE}/api/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          if (!regRes.ok) {
            const err = await regRes.json().catch(() => ({}));
            throw new Error(err.detail || `Registration failed (${regRes.status})`);
          }
        }

        // Login — backend uses OAuth2PasswordRequestForm (form-encoded, not JSON)
        const formData = new URLSearchParams();
        formData.append("username", email);   // OAuth2 spec: field is "username"
        formData.append("password", password);

        const loginRes = await fetch(`${API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData,
        });

        if (!loginRes.ok) {
          const err = await loginRes.json().catch(() => ({}));
          throw new Error(err.detail || `Login failed (${loginRes.status})`);
        }

        const data = await loginRes.json();
        const token = data.access_token;

        if (!token) throw new Error("No token received from server.");

        // Persist token for all dashboard pages and chrome extension
        localStorage.setItem("scythe_token", token);
        localStorage.setItem("scythe_email", email);

        // Also push to chrome.storage.local if running inside the extension context
        if (typeof chrome !== "undefined" && chrome.storage && chrome.storage.local) {
          chrome.storage.local.set({ scythe_token: token, scythe_email: email });
        }

        window.location.href = "dashboard.html";

      } catch (err) {
        showError(err.message || "Authentication failed. Please try again.");
        submitBtn.disabled = false;
        submitBtn.textContent = mode === "login" ? "Login" : "Create account";
      }
    }

    // Auto-redirect if already logged in
    (function checkAlreadyLoggedIn() {
      const tok = localStorage.getItem("scythe_token");
      if (tok) window.location.href = "dashboard.html";
    })();
  </script>
</body>
</html>

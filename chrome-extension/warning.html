<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCYTHE Security Warning</title>

    <link rel="stylesheet" href="warning.css">
</head>
<body>

<div class="container">

    <div class="shield">
      <!-- Inline SVG — no external CDN dependency -->
      <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>

    <h1>Dangerous Website Blocked</h1>

    <p class="subtitle">
        SCYTHE has prevented this page from loading because it appears to be unsafe.
    </p>

    <div class="card">

        <div class="row">
            <span>Website</span>
            <strong id="website">Loading...</strong>
        </div>

        <div class="row">
            <span>Severity</span>
            <strong id="severity">Loading...</strong>
        </div>

        <div class="row">
            <span>Risk Score</span>
            <strong id="score">Loading...</strong>
        </div>

    </div>

    <div class="reason">

        <h3>Reason</h3>

        <p id="explanation">
            Loading...
        </p>

    </div>

    <div class="indicators">

        <h3>Threat Indicators</h3>

        <ul id="indicatorList"></ul>

    </div>

    <div class="buttons">

        <button id="backBtn">
            ← Go Back
        </button>

        <button id="dashboardBtn">
            View Report
        </button>

        <button class="danger" id="continueBtn">
            Continue Anyway
        </button>

    </div>

</div>

<script src="config.js"></script>
<script src="warning.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCYTHE Threat Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="popup-container">
    
    <!-- HEADER -->
    <header>
      <div class="logo-group">
        <img
          id="headerLogoImg"
          src="icons/default_logo.jpeg"
          alt="SCYTHE"
          class="header-logo-img"
        >
        <span class="logo-text">SCYTHE</span>
      </div>
      
      <button class="theme-toggle" id="themeToggleBtn" type="button" aria-label="Toggle visual theme">
        <!-- Moon Icon (shown in Light Mode to switch to Dark) -->
        <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <!-- Sun Icon (shown in Dark Mode to switch to Light) -->
        <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
    </header>

    <!-- MAIN SCROLLABLE CONTENT -->
    <main>
      
      <!-- HERO STATUS PANEL (Top Row) -->
      <section class="hero-section" id="heroSection">
        <div class="hero-shield-wrapper" id="heroShieldWrapper">
          <img
            id="heroLogoImg"
            src="icons/default_logo.jpeg"
            alt="SCYTHE threat status"
            class="hero-logo-img"
          >
        </div>
        <div class="hero-info">
          <h1 class="hero-status-title" id="heroStatusTitle">SAFE SITE</h1>
          <div class="hero-url" id="heroUrl">google.com</div>
          <div class="hero-status-badge allowed" id="heroStatusBadge">SECURE | LOW RISK</div>
        </div>
      </section>

      <!-- ARC GAUGE PANEL (Middle Row) -->
      <section class="gauge-card">
        <div class="gauge-wrapper">
          <svg class="gauge-ring" width="160" height="110" viewBox="0 0 160 110">
            <!-- Speedometer track and active segments -->
            <circle class="gauge-ring__background" cx="80" cy="65" r="54" stroke-width="8"/>
            <circle class="gauge-ring__circle" id="gaugeCircle" cx="80" cy="65" r="54" stroke-width="8"/>
          </svg>
          <div class="gauge-text-container">
            <span class="gauge-label">SECURITY SCORE</span>
            <span class="gauge-value" id="securityScoreText">—</span>
            <span class="gauge-sub-label" id="securityScoreRating">EXCELLENT</span>
          </div>
        </div>
      </section>

      <!-- SITE SECURITY DETAILS (2x2 Grid) -->
      <article class="info-card">
        <div class="card-title-group">
          <span class="card-title">SITE SECURITY DETAILS</span>
        </div>
        
        <div class="details-grid">
          <!-- Item 1: Domain -->
          <div class="grid-item">
            <div class="grid-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
            </div>
            <div class="grid-content">
              <div class="grid-label">Site</div>
              <div class="grid-value" id="gridSiteUrl">—</div>
            </div>
          </div>

          <!-- Item 2: SSL Status -->
          <div class="grid-item">
            <div class="grid-icon" id="gridSSLIcon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <div class="grid-content">
              <div class="grid-label">SSL Status</div>
              <div class="grid-value" id="gridSSLStatus">—</div>
            </div>
          </div>

          <!-- Item 3: Reputation -->
          <div class="grid-item">
            <div class="grid-icon" id="gridReputationIcon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
            <div class="grid-content">
              <div class="grid-label">Reputation</div>
              <div class="grid-value" id="gridReputationStatus">—</div>
            </div>
          </div>

          <!-- Item 4: Threats / Malware -->
          <div class="grid-item">
            <div class="grid-icon" id="gridThreatsIcon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
            </div>
            <div class="grid-content">
              <div class="grid-label">Threats</div>
              <div class="grid-value" id="gridThreatsStatus">—</div>
            </div>
          </div>
        </div>
      </article>

    </main>

    <!-- FOOTER ACTIONS -->
    <footer>
      <!-- Toggle Live Protection (shown when site is safe/caution) -->
      <div class="toggle-container" id="protectionToggleContainer">
        <div class="toggle-text-group">
          <span class="toggle-title">LIVE PROTECTION</span>
          <span class="toggle-subtitle" id="protectionToggleStatus">ON</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="protectionSwitch" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Go Back Button (fallback shown when site is blocked/risky) -->
      <button class="btn btn-outline" id="backBtn" type="button" style="display: none;">Go Back</button>

      <!-- Primary Action -->
      <button class="btn btn-primary" id="dashboardBtn" type="button">Open Dashboard</button>
    </footer>

  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>

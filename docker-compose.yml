# =======================================================
# SCYTHE — Master Docker Compose  (v4 — network pool fix + pinned socket proxy)
# 8 containers + 1 socket proxy + shared volumes
#
# Containers:
#   nginx              — Receptionist (port 80 → 443, terminates TLS)
#   backend            — FastAPI / Uvicorn
#   redis              — Broker + result backend + final verdict cache
#   postgres           — Primary datastore (users, scans, incidents, IOCs)
#   celery_worker      — Task runner (OCR, vision, sandbox, risk_fusion, alerts)
#   celery_beat        — Periodic scheduler (file cleanup, health sweeps)
#   docker_socket_proxy— Scoped Docker API proxy (replaces raw socket mount)
#   sandbox            — Playwright detonation container (isolated network)
#
# Networks:
#   scythe_net        — Internal bridge for core services (nginx/backend/db/redis/beat)
#   docker_proxy_net — Isolated bridge, ONLY scythe_sandbox_runner + docker_socket_proxy.
#   sandbox_net      — Isolated bridge for sandbox only (no route to scythe_net)
#
# =======================================================


# -------------------------------------------------------
# SHARED CONFIGURATION ANCHORS
# Common environment variables reused across all backend services
x-common-env: &common-env
  SCYTHE_DB_PASSWORD: ${SCYTHE_DB_PASSWORD:?SCYTHE_DB_PASSWORD must be set in .env}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
  REDIS_SECURITY_PASSWORD: ${REDIS_SECURITY_PASSWORD:-${REDIS_PASSWORD}}
  REQUIRE_REAL_CERT: ${REQUIRE_REAL_CERT:-false}
  SHADOW_SCORING_ENABLED: ${SHADOW_SCORING_ENABLED:-false}
  MODEL_RELEASE_ENABLED: ${MODEL_RELEASE_ENABLED:-false}
  MODEL_RELEASE_BUNDLE_DIR: ${MODEL_RELEASE_BUNDLE_DIR:-/opt/scythe/bundle}
  MODEL_RELEASE_CHECKSUMS_SHA256: ${MODEL_RELEASE_CHECKSUMS_SHA256:-}

x-backend-common: &backend-common
  env_file:
    - ./.env
  environment:
    <<: *common-env
  volumes:
    - scythe_shared_scans:/shared/scans
    - ./containers/backend/models:/app/models:ro
    - ${MODEL_RELEASE_HOST_DIR:-./models/releases}:/opt/scythe/release:ro
  # Python (FastAPI, Celery worker, Beat) requires read_only: false for runtime bytecode compilation
  # (__pycache__) across dynamic module loads and Celery Beat schedule database synchronization.
  # Hardening is enforced via non-root execution (UID 10001), cap_drop: [ALL], and no-new-privileges: true.
  read_only: false
  tmpfs:
    - /tmp
    - /app/.cache
  networks:
    - scythe_net
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis_security:
      condition: service_healthy
    clamav:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

# Resource limit anchor reused by all long-running services
x-default-resources: &default-resources
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1024M
      reservations:
        cpus: "0.25"
        memory: 256M

# -------------------------------------------------------
# SERVICES
# -------------------------------------------------------
services:

  # ---------------------------------------------------
  # 1. NGINX — Receptionist
  # ---------------------------------------------------
  nginx:
    container_name: scythe_nginx
    build:
      context: ./containers/nginx
      dockerfile: Dockerfile
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTPS_PORT:-443}:443"
    environment:
      - REQUIRE_REAL_CERT=${REQUIRE_REAL_CERT:-false}
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-443}
    volumes:
      - ./dashboard:/var/www/dashboard:ro
      - nginx_local_certs:/etc/nginx/certs
    networks:
      scythe_net:
        ipv4_address: ${SCYTHE_NGINX_IPV4:-172.24.0.10}
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/log/nginx:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    restart: unless-stopped
    <<: *default-resources

  # ---------------------------------------------------
  # 2. BACKEND — FastAPI / Uvicorn
  # ---------------------------------------------------
  backend:
    <<: *backend-common
    build:
      context: ./containers/backend
      dockerfile: Dockerfile
    container_name: scythe_backend
    volumes:
      - scythe_shared_scans:/shared/scans
      - scythe_bundle_v26:/opt/scythe/bundle
      - ./containers/backend/models:/app/models:ro
      - ${MODEL_RELEASE_HOST_DIR:-./models/releases}:/opt/scythe/release:ro
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --workers ${WORKER_COUNT:-2}
      --log-level info
      --proxy-headers
      --forwarded-allow-ips=${SCYTHE_NGINX_IPV4:-172.24.0.10}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------
  # 3. REDIS — Broker + Cache
  # ---------------------------------------------------
  redis:
    container_name: scythe_redis
    build:
      context: ./containers/vendor
      dockerfile: redis/Dockerfile
    image: scythe-redis:7.2-alpine-hardened
    user: "999"
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    networks:
      - scythe_net
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    <<: *default-resources

  redis_security:
    container_name: scythe_redis_security
    build:
      context: ./containers/vendor
      dockerfile: redis/Dockerfile
    image: scythe-redis:7.2-alpine-hardened
    user: "999"
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_SECURITY_PASSWORD:-${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}}
    volumes:
      - redis_security_data:/data
    networks:
      - scythe_net
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SECURITY_PASSWORD:-${REDIS_PASSWORD}}", "ping"]
      interval: 10s
      timeout: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    <<: *default-resources

  # ---------------------------------------------------
  # 4. POSTGRES — Primary Datastore
  # ---------------------------------------------------
  postgres:
    container_name: scythe_postgres
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD:?POSTGRES_ROOT_PASSWORD must be set in .env}
      POSTGRES_DB: postgres
      SCYTHE_DB_PASSWORD: ${SCYTHE_DB_PASSWORD:?SCYTHE_DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./containers/postgres/init.sh:/docker-entrypoint-initdb.d/01_init.sh:ro
    networks:
      scythe_net:
        aliases:
          - postgres
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Required capability set for official postgres:16-alpine during container boot and initdb
    # (CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER needed by gosu/su-exec before switching from root to postgres user).
    # Accepted risk / future hardening: migrate boot initialization to a dedicated init-container to allow cap_drop: ALL at runtime.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ---------------------------------------------------
  # 5. DOCKER SOCKET PROXY — Scoped API gateway
  #    Pinned repo:tag@digest — see change log at the top of this file.
  #    Scope note: Exposes CONTAINERS=1, IMAGES=1, and POST=1. This allows container creation,
  #    start, stop, kill, and image inspection/pulling (POST /images/create).
  #    Because tecnativa/docker-socket-proxy applies POST globally across enabled endpoints,
  #    CONTAINERS=1 + POST=1 covers stop/kill on any container reachable on this daemon socket.
  #    Security relies entirely on strict network isolation: ONLY scythe_sandbox_runner sits on
  #    docker_proxy_net, and it is protected by non-root execution and X-Runner-Auth HMAC gating.
  #
  #    Production Hardening Note (Finding #3):
  #    If this blast radius is unacceptable for your threat model, run `scythe_sandbox_runner`
  #    against a dedicated isolated/rootless Docker daemon or remote Docker context (`DOCKER_HOST`)
  #    so that compromised runner credentials cannot touch core infrastructure containers.
  # ---------------------------------------------------
  docker_socket_proxy:
    container_name: scythe_socket_proxy
    build:
      context: ./containers/vendor
      dockerfile: socket-proxy/Dockerfile
    image: scythe-socket-proxy:v0.5.0-hardened
    environment:
      CONTAINERS: 1
      POST: 1
      # Explicitly disable container actions not needed for sandbox detonation
      STOP: 0
      KILL: 0
      RESTART: 0
      PAUSE: 0
      UNPAUSE: 0
      # AUTH: 0 — Disables Docker /auth endpoint.
      # WARNING: Tecnativa/docker-socket-proxy is an ACL gateway filtering by API endpoint.
      # It does NOT natively enforce HTTP Basic Auth (BASIC_AUTH_INFO is unsupported).
      # Security relies entirely on network isolation inside docker_proxy_net and endpoint ACLs below.
      # Treat any addition of containers to docker_proxy_net as a critical security review item.
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 1
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_proxy_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp
      - /run
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ---------------------------------------------------
  # 5b. SANDBOX RUNNER — Purpose-Built Admission Control
  # ---------------------------------------------------
  scythe_sandbox_runner:
    build:
      context: ./containers/backend
      dockerfile: Dockerfile.runner
    container_name: scythe_sandbox_runner
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DOCKER_HOST: tcp://docker_socket_proxy:2375
      SANDBOX_NETWORK: scythe_sandbox_net
      SHARED_SCANS_VOLUME: scythe_shared_scans
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-scythe-sandbox@sha256:c10140e89411622b4c6331e440690d186f5b7c9f279cf1d88c589379763ac54c}
      SANDBOX_RUNNER_SECRET: ${SANDBOX_RUNNER_SECRET:?SANDBOX_RUNNER_SECRET must be set in .env}
      MAX_CONCURRENT_DETONATIONS: "10"
    volumes:
      - ./containers/backend/models:/app/models:ro
    networks:
      - scythe_net          # celery_worker communicates here via RPC
      - docker_proxy_net   # docker_socket_proxy ONLY reachable by this service
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/runner/.docker
    restart: unless-stopped
    depends_on:
      docker_socket_proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------
  # 6. CELERY WORKER — Task Runner
  # ---------------------------------------------------
  celery_worker:
    <<: *backend-common
    build:
      context: ./containers/backend
      dockerfile: Dockerfile.worker
    container_name: scythe_celery_worker
    volumes:
      - scythe_shared_scans:/shared/scans
      - db_backups:/backups
      - ./containers/backend/models:/app/models:ro
      - ${MODEL_RELEASE_HOST_DIR:-./models/releases}:/opt/scythe/release:ro
    networks:
      - scythe_net          # Postgres, Redis, scythe_sandbox_runner
    entrypoint: ["/app/celery_entrypoint.sh"]
    command: >
      celery -A celery_worker worker
      --loglevel=info
      --concurrency=2
      --queues=default,sandbox,alerts
      --hostname=worker@%h
    environment:
      <<: *common-env
      SANDBOX_RUNNER_URL: http://scythe_sandbox_runner:8002/detonate
      SANDBOX_RUNNER_SECRET: ${SANDBOX_RUNNER_SECRET:?SANDBOX_RUNNER_SECRET must be set in .env}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SANDBOX_NETWORK: scythe_sandbox_net
      SHARED_SCANS_VOLUME: scythe_shared_scans
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_security:
        condition: service_healthy
      scythe_sandbox_runner:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker inspect ping --timeout 5 2>&1 | grep -c pong || exit 1"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M
        reservations:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------
  # 6A. OPTIONAL SHADOW MODEL WORKER — isolated CPU queue
  # Start only with: --profile shadow and SHADOW_SCORING_ENABLED=true.
  # Model bundles are mounted read-only and must match operator-pinned hashes.
  # ---------------------------------------------------
  celery_shadow_worker: &ml-worker
    profiles: ["shadow"]
    env_file:
      - ./.env
    build:
      context: ./containers/backend
      dockerfile: Dockerfile.shadow
    container_name: scythe_celery_shadow_worker
    volumes:
      - scythe_shared_scans:/shared/scans
      - ${SHADOW_LIGHTGBM_HOST_DIR:-../lightgbm_dataset/fresh/artifacts/lightgbm_dev_v2_shadow_native_v1}:/opt/scythe/lightgbm_dev_v2_shadow_native_v1:ro
      - ${SHADOW_MOBILECLIP_HOST_DIR:-../mobileclip-dataset}:/opt/scythe/mobileclip-dataset:ro
    networks:
      - scythe_net
    entrypoint: ["/app/celery_entrypoint.sh"]
    command: >
      celery -A celery_worker worker
      --loglevel=info
      --concurrency=1
      --queues=shadow
      --hostname=shadow@%h
    environment: &ml-environment
      <<: *common-env
      SCYTHE_DB_PASSWORD: ${SCYTHE_DB_PASSWORD:?SCYTHE_DB_PASSWORD must be set in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_SECURITY_PASSWORD: ${REDIS_SECURITY_PASSWORD:-${REDIS_PASSWORD}}
      SHADOW_SCORING_ENABLED: ${SHADOW_SCORING_ENABLED:-false}
      SHADOW_LIGHTGBM_BUNDLE_DIR: /opt/scythe/lightgbm_dev_v2_shadow_native_v1
      SHADOW_LIGHTGBM_CHECKSUMS_SHA256: ${SHADOW_LIGHTGBM_CHECKSUMS_SHA256:-245221b077ea22abdc8f5732b5e4a846bf09f4dfc45ec4d179edae693ee2186c}
      SHADOW_MOBILECLIP_SOURCE_DIR: /opt/scythe/mobileclip-dataset
      SHADOW_MOBILECLIP_ARTIFACT_DIR: /opt/scythe/mobileclip-dataset/artifacts/mobileclip_v2
      SHADOW_MOBILECLIP_CHECKSUMS_SHA256: ${SHADOW_MOBILECLIP_CHECKSUMS_SHA256:-726c0d9b1cce68d53c7b8fe2aa99d1fe74b546887a11704ee1efed7ad2d91832}
      SHADOW_MOBILECLIP_SCORER_PATH: /opt/scythe/mobileclip-dataset/score_mobileclip_v2.py
      SHADOW_MOBILECLIP_SCORER_SHA256: ${SHADOW_MOBILECLIP_SCORER_SHA256:-8e427b9ae71bdd242ec15d83777c633781cc0acde951c060298c3f65903bc1c4}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_security:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker inspect ping --timeout 5 2>&1 | grep -c pong || exit 1"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 1024M

  # Validated inference uses the same isolated dependencies, its own queue and
  # read-only release mount. Enabling the profile alone never approves a model.
  celery_model_worker:
    <<: *ml-worker
    profiles: ["models"]
    container_name: scythe_celery_model_worker
    command: >
      celery -A celery_worker worker
      --loglevel=info --concurrency=1 --queues=models --hostname=models@%h
    environment:
      <<: *ml-environment
      SHADOW_SCORING_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker inspect ping --destination=models@$$HOSTNAME --timeout 5 2>&1 | grep -q pong"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 45s
    volumes:
      - scythe_shared_scans:/shared/scans
      - scythe_bundle_v26:/opt/scythe/bundle
      - ${MODEL_RELEASE_HOST_DIR:-./models/releases}:/opt/scythe/release:ro
      - ${SHADOW_LIGHTGBM_HOST_DIR:-../lightgbm_dataset/fresh/artifacts/lightgbm_dev_v2_shadow_native_v1}:/opt/scythe/lightgbm_dev_v2_shadow_native_v1:ro
      - ${SHADOW_MOBILECLIP_HOST_DIR:-../mobileclip-dataset}:/opt/scythe/mobileclip-dataset:ro

  # ---------------------------------------------------
  # 7. CELERY BEAT — Periodic Scheduler
  # ---------------------------------------------------
  # Explicit opt-in only; no mailbox is contacted by the default stack.
  email_poller:
    profiles: ["mailbox"]
    image: scythe-celery_worker:latest
    entrypoint: ["python", "-m", "email_engine.poller"]
    environment:
      EMAIL_OWNER_USER_ID: ${EMAIL_OWNER_USER_ID:-}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_POLLER_TOKEN: ${EMAIL_POLLER_TOKEN:-}
      EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST:-imap.gmail.com}
      EMAIL_AUTH_MODE: ${EMAIL_AUTH_MODE:-oauth2}
      EMAIL_ACCESS_TOKEN: ${EMAIL_ACCESS_TOKEN:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
      EMAIL_POLL_INTERVAL: ${EMAIL_POLL_INTERVAL:-30}
      EMAIL_SHARED_DIR: /shared/scans
      BACKEND_INGEST_URL: http://backend:8000
    volumes:
      - scythe_shared_scans:/shared/scans
    networks: [scythe_net]
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/scythe/.cache:rw,noexec,nosuid,size=32m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"
    <<: *default-resources

  celery_beat:
    <<: [*backend-common,  *default-resources]
    build:
      context: ./containers/backend
      dockerfile: Dockerfile.worker
    container_name: scythe_celery_beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_security:
        condition: service_healthy
    entrypoint: ["/app/celery_entrypoint.sh"]
    command: >
      celery -A celery_beat beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
      --schedule /app/celerybeat-schedule/celerybeat-schedule
    volumes:
      - scythe_shared_scans:/shared/scans
      - celery_beat_data:/app/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/celerybeat-schedule/celerybeat-schedule"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------
  # 8. CLAMAV — Anti-Malware Sidecar Daemon
  # ---------------------------------------------------
  clamav:
    container_name: scythe_clamav
    image: clamav/clamav:stable@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    environment:
      - CLAMAV_NO_FRESHCLAM=false
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      scythe_net:
        aliases:
          - clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc localhost 3310 | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
        reservations:
          cpus: "0.25"

  # ---------------------------------------------------
  # 8b. SANDBOX NET HOLDER — Keeps `scythe_sandbox_net` active
  # ---------------------------------------------------
  sandbox_net_holder:
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    container_name: scythe_sandbox_net_holder
    command: ["tail", "-f", "/dev/null"]
    networks:
      - sandbox_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    user: "65534:65534"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 16M

  # ---------------------------------------------------
  # 9. SANDBOX — Playwright Detonation Container
  # ---------------------------------------------------
  sandbox:
    container_name: scythe_sandbox
    build:
      context: ./containers
      dockerfile: sandbox/docker/Dockerfile
    image: ${SANDBOX_DEBUG_IMAGE:-scythe-sandbox:local}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # --- Security notice (Volume Scoping & Isolation - Finding #3) ---
    # This standalone/manual profile mounts the entire `shared_scans` volume at `/app/output`
    # for local debugging (`scythe.ps1 sandbox <url>`). Any container executed via this profile
    # can read or overwrite existing scan artifacts across all past scans on the shared volume.
    # For automated production pipelines, ALWAYS use the `scythe_sandbox_runner` admission-control
    # microservice (POST /detonate), which dynamically isolates each scan using `--mount
    # type=volume,source=shared_scans,target=/app/output,volume-subpath=<scan_id>`.
    volumes:
      - scythe_shared_scans:/app/output
    networks:
      - sandbox_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/sandbox/.config:rw,noexec,nosuid,size=32m
      - /home/sandbox/.pki:rw,noexec,nosuid,size=16m
      - /home/sandbox/.local:rw,noexec,nosuid,size=32m
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2048M
          pids: 512
        reservations:
          cpus: "0.25"
          memory: 512M
    profiles:
      - sandbox


# -------------------------------------------------------
# VOLUMES
# -------------------------------------------------------
volumes:
  nginx_local_certs:
    name: scythe_nginx_local_certs
  postgres_data:
    driver: local
    name: scythe_postgres_data
  db_backups:
    driver: local
    name: scythe_db_backups
  celery_beat_data:
    driver: local
    name: scythe_celery_beat_data
  clamav_db:
    driver: local
    name: scythe_clamav_db
  redis_data:
    driver: local
    name: scythe_redis_data
  redis_security_data:
    driver: local
    name: scythe_redis_security_data
  scythe_shared_scans:
    driver: local
    name: scythe_shared_scans
  scythe_bundle_v26:
    external: true
    name: scythe_bundle_v26

# -------------------------------------------------------
# NETWORKS
# -------------------------------------------------------
networks:
  scythe_net:
    driver: bridge
    name: scythe_net
    ipam:
      config:
        - subnet: ${SCYTHE_NETWORK_SUBNET:-172.24.0.0/16}

  docker_proxy_net:
    driver: bridge
    internal: true
    name: scythe_docker_proxy_net

  sandbox_net:
    driver: bridge
    attachable: true
    internal: false   # internet egress allowed for URL detonation
    name: scythe_sandbox_net
